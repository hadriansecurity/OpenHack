[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-pentesting-agent"
version = "0.1.0"
description = "File-based, scenario-first workspace for source-guided whitebox security review."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "jsonschema>=4.18",
]

[project.scripts]
whitebox = "whitebox_pentesting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
