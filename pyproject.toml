[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-pentesting-agent"
version = "0.1.0"
description = "File-based, scenario-first workspace for source-guided whitebox security review."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "types-jsonschema",
]

[project.scripts]
whitebox = "whitebox_pentesting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.mypy]
files = ["src"]

# Modules below are fully type-annotated; require new code in them to stay
# typed. Other modules remain untyped for now (see PR #5).
[[tool.mypy.overrides]]
module = [
  "whitebox_pentesting_agent.backlog",
  "whitebox_pentesting_agent.coverage",
  "whitebox_pentesting_agent.models",
  "whitebox_pentesting_agent.recon",
  "whitebox_pentesting_agent.results",
  "whitebox_pentesting_agent.router_context",
  "whitebox_pentesting_agent.triage",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
